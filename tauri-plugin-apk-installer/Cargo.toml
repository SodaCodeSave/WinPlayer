[package]
name = "tauri-plugin-apk-installer"
version = "0.1.0"
description = "Tauri 2 plugin that launches the Android package installer for a downloaded APK (no-op on desktop)."
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-apk-installer"
license = "MIT"

[lib]
name = "tauri_plugin_apk_installer"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", default-features = false, features = [] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2.0.2", features = ["build"] }
