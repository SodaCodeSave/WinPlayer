<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>WinPlayer 浏览器联调（Tauri IPC 桩）</title>
  <script type="module">
    // ---- Tauri IPC 桩：必须在应用模块加载前安装 ----
    const db = new Map();
    // 预置一个播放源偏好，验证「搜索格式」输入框显隐与持久化链路
    db.set("settings.playSourceId", JSON.stringify("com.test.mock"));

    const setSettingLog = [];
    window.__setSettingLog = setSettingLog;
    window.__db = db;

    const mockRows = {
      settings: (values) => {
        const key = values?.[0];
        return db.has(key) ? [{ value: db.get(key) }] : [];
      },
      plugin_state: () => [],
    };

    function mockInvoke(cmd, args) {
      if (cmd === "plugin:sql|load") return Promise.resolve("ok");
      if (cmd === "plugin:sql|select") {
        const sql = String(args?.sql ?? "");
        if (sql.includes("from settings")) return Promise.resolve(mockRows.settings(args?.values));
        if (sql.includes("plugin_state")) return Promise.resolve([]);
        if (sql.includes("liked_songs")) return Promise.resolve([]);
        console.warn("[sql:select 未匹配]", sql);
        return Promise.resolve([]);
      }
      if (cmd === "plugin:sql|execute") {
        const sql = String(args?.sql ?? "");
        const values = args?.values ?? [];
        if (sql.includes("into settings")) {
          const [key, value] = values;
          db.set(key, value);
          setSettingLog.push({ key, value, at: Date.now() });
          // 写入 DOM（跨 JS 世界可见），供诊断读取
          const root = document.documentElement;
          root.dataset.setlog = (root.dataset.setlog ? root.dataset.setlog + "|" : "") + key + "=" + value;
          console.log("[setSetting]", key, "=", value);
        }
        // tauri-plugin-sql 的 execute 期望返回数组 [rowsAffected, lastInsertId]
        return Promise.resolve([1, 0]);
      }
      if (cmd === "plugin_list") {
        return Promise.resolve([
          {
            id: "com.test.mock",
            kind: "file",
            manifest: {
              id: "com.test.mock",
              name: "测试源",
              version: "1.0.0",
              capabilities: ["search", "songUrl", "lyrics", "avatar", "recommend"],
              settings: [],
            },
          },
        ]);
      }
      if (cmd === "cache_stats") return Promise.resolve({ imageCount: 0, imageBytes: 0 });
      if (cmd === "plugin:event|listen") return Promise.resolve(1);
      if (cmd === "plugin:event|unlisten") return Promise.resolve(null);
      console.log("[invoke 默认返回 null]", cmd, args);
      return Promise.resolve(null);
    }

    let cbId = 1;
    window.__TAURI_INTERNALS__ = {
      metadata: {
        currentWindow: { label: "main" },
        currentWebview: { label: "main", windowLabel: "main" },
      },
      invoke: (cmd, args, _options) => mockInvoke(cmd, args),
      transformCallback: (callback) => cbId++,
      plugins: {},
      resources: {},
    };
    console.log("[stub] Tauri IPC 桩已安装");
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    await import("/src/main.ts");

    // ---- 诊断探针：包装所有 ComboBox 实例的 emit，记录所有派发事件 ----
    const patched = new WeakSet();
    function patchComboBox(root) {
      if (!(root instanceof Element)) return;
      const candidates = [root, ...root.querySelectorAll("*")];
      for (const el of candidates) {
        const comp = el.__vueParentComponent;
        if (!comp || comp.type?.name !== "ComboBox" || patched.has(comp)) continue;
        patched.add(comp);
        const origEmit = comp.emit.bind(comp);
        comp.emit = (ev, ...args) => {
          console.log("[probe:emit]", ev, JSON.stringify(args?.[1] ?? args?.[0] ?? null)?.slice(0, 200));
          return origEmit(ev, ...args);
        };
        console.log("[probe] 已挂钩 ComboBox", comp.uid, "props.onSelectionChanged =", typeof comp.vnode.props?.onSelectionChanged);
      }
    }
    new MutationObserver((muts) => {
      for (const m of muts) for (const n of m.addedNodes) patchComboBox(n);
    }).observe(document.body, { childList: true, subtree: true });
    patchComboBox(document.body);

    document.addEventListener("click", (e) => {
      const cls = typeof e.target?.className === "string" ? e.target.className.slice(0, 60) : "";
      console.log("[probe:click]", cls, "defaultPrevented =", e.defaultPrevented);
    }, true);
    window.addEventListener("error", (e) => {
      console.log("[probe:error]", e.message, "@", e.filename, e.lineno + ":" + e.colno, "\n", e.error?.stack);
    });
    window.addEventListener("unhandledrejection", (e) => {
      console.log("[probe:rejection]", e.reason?.stack ?? String(e.reason));
    });
    console.log("[probe] 探针已安装");
  </script>
</body>
</html>
