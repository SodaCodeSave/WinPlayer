<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>ComboBox 测试</title></head>
<body>
<div id="app"></div>
<script type="module">
import { createApp, ref, h } from "vue";
import { ComboBox, WinUIOnWeb } from "winuionweb";
import "winuionweb/style.css";

const USE_GLOBAL_PLUGIN = new URLSearchParams(location.search).get("plugin") === "1";

const log = ref([]);
function addLog(msg) { log.value.push(msg); console.log(msg); }

// 写法 A：稳定函数引用（SFC 中 @SelectionChanged="fn" 编译为 onSelectionChanged）
const labelsA = ["甲", "乙", "丙"];
function onA(_sender, payload) {
  addLog("A 稳定引用触发: sender=" + typeof _sender + " payload=" + JSON.stringify(payload));
}

// 写法 B：工厂函数返回处理器（与设置页来源偏好一致）
const labelsB = ["默认", "插件一", "插件二"];
function makeHandler(tag) {
  return (_sender, payload) => {
    addLog("B 工厂[" + tag + "]触发: payload=" + JSON.stringify(payload));
  };
}

// 写法 C：winuionweb 标记风格的 SelectionChanged 属性（非 on 前缀）
const app = createApp({
  setup() {
    return () =>
      h("div", { style: "padding:20px;display:flex;flex-direction:column;gap:16px;width:360px" }, [
        h("p", USE_GLOBAL_PLUGIN ? "模式：已安装 WinUIOnWeb 全局插件" : "模式：未安装全局插件"),
        h("h3", "写法A：onSelectionChanged 稳定引用"),
        h(ComboBox, { ItemsSource: labelsA, SelectedIndex: 0, onSelectionChanged: onA }),
        h("h3", "写法B：onSelectionChanged 工厂"),
        h(ComboBox, { ItemsSource: labelsB, SelectedIndex: 0, onSelectionChanged: makeHandler("b1") }),
        h("h3", "写法C：SelectionChanged 普通属性"),
        h(ComboBox, {
          ItemsSource: labelsB,
          SelectedIndex: 0,
          SelectionChanged: (_s, p) => addLog("C 普通属性触发: " + JSON.stringify(p)),
        }),
        h("pre", { style: "background:#eee;padding:8px;white-space:pre-wrap" }, log.value.join("\n") || "（暂无事件）"),
      ]);
  },
});
if (USE_GLOBAL_PLUGIN) app.use(WinUIOnWeb, { locale: "zh-CN" });
app.mount("#app");
</script>
</body>
</html>
