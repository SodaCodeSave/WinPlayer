name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64：NSIS + MSI
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            os: windows
            arch: x64
          # Windows ARM64：NSIS（WiX 暂不支持 arm64 的 msi）
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
            os: windows
            arch: arm64
          # macOS Apple Silicon
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            os: macos
            arch: arm64
          # macOS Intel
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            os: macos
            arch: x64
          # Linux x64（用 22.04 以兼容较旧 glibc）
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            os: linux
            arch: x64
          # Linux ARM64（ubuntu-24.04-arm 免费 runner，仅公共仓库可用；私有仓库请改用交叉编译）
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            os: linux
            arch: arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # 版本号：tag 构建取 tag（去 v 前缀），手动构建回退到 tauri.conf.json
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Tauri v2 Linux 系统依赖（libasound2-dev：cpal/rodio 音频输出的 ALSA 依赖）
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tag 构建时把代码内版本号同步为 tag 版本（仅改本次构建工作区，
      # 保证安装包与应用内版本一致；回写仓库由 release job 负责）
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = process.env.VERSION;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
              console.log(f + " -> " + process.env.VERSION);
            }
          '
          # -i.bak 跨 GNU/BSD sed 通用，改完删除备份
          sed -i.bak 's/^version = "[^"]*"/version = "'"$VERSION"'"/' src-tauri/Cargo.toml
          rm src-tauri/Cargo.toml.bak

      - name: Build desktop app
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # 重命名为 WinPlayer-{版本}-{平台}-{架构}[-类型].{扩展名}
      - name: Rename artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist-renamed
          base="src-tauri/target/${{ matrix.target }}/release/bundle"
          copy() {
            for f in "$@"; do
              [ -e "$f" ] || continue
              ext="${f##*.}"
              # .exe 加 -setup 类型后缀，避免与同平台其他包混淆
              if [ "$ext" = "exe" ]; then
                cp "$f" "dist-renamed/WinPlayer-$VERSION-$OS-$ARCH-setup.exe"
              else
                cp "$f" "dist-renamed/WinPlayer-$VERSION-$OS-$ARCH.$ext"
              fi
            done
          }
          copy "$base"/nsis/*.exe
          copy "$base"/msi/*.msi
          copy "$base"/dmg/*.dmg
          copy "$base"/deb/*.deb
          copy "$base"/rpm/*.rpm
          copy "$base"/appimage/*.AppImage
          ls -la dist-renamed

      # 归一化产物目录并上传
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist-renamed/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号：tag 构建取 tag（去 v 前缀），手动构建回退到 tauri.conf.json
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub ubuntu runner 已预装 Android SDK / NDK，只需补 Rust 目标
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tag 构建时把代码内版本号同步为 tag 版本（仅改本次构建工作区，不提交仓库）
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = process.env.VERSION;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
              console.log(f + " -> " + process.env.VERSION);
            }
          '
          sed -i.bak 's/^version = "[^"]*"/version = "'"$VERSION"'"/' src-tauri/Cargo.toml
          rm src-tauri/Cargo.toml.bak

      # gen/android 未入库，首次构建时自动初始化
      - name: Init Android project
        if: hashFiles('src-tauri/gen/android/**') == ''
        run: pnpm tauri android init

      # Tauri 的 android 模板自带「默认启动图标」，`tauri android init` 只会解压模板，
      # 不会用 src-tauri/icons/android 覆盖它（仅 `tauri icon` 在后端工程已存在时才写入
      # gen/android/app/src/main/res）。所以必须在此手动同步，否则 APK 永远显示默认图标。
      - name: Apply Android launcher icons
        run: pnpm android:icons

      # Tauri 模板的 buildSrc 走默认 Gradle Plugin Portal 解析 kotlin-dsl
      # 的传递依赖（kotlin-stdlib 等），portal 对最新 kotlin 版本常未同步
      # 导致 "Could not find org.jetbrains.kotlin:kotlin-stdlib:2.x"；
      # 注入 pluginManagement 仓库让 Maven Central 兜底
      - name: Patch Gradle repositories
        run: |
          python3 - <<'PYEOF'
          import pathlib
          block = "\n".join([
              "pluginManagement {",
              "    repositories {",
              "        google()",
              "        mavenCentral()",
              "        gradlePluginPortal()",
              "    }",
              "}",
              "",
          ])
          root = pathlib.Path("src-tauri/gen/android")
          for name in ("settings.gradle.kts", "buildSrc/settings.gradle.kts"):
              p = root / name
              if p.exists():
                  s = p.read_text(encoding="utf-8")
                  if "pluginManagement" not in s:
                      p.write_text(block + s, encoding="utf-8")
                      print(f"patched {name}")
                  else:
                      print(f"already has pluginManagement: {name}")
              else:
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(block, encoding="utf-8")
                  print(f"created {name}")
          PYEOF

      # cpal 的 Oboe 宿主依赖 C++ 运行时（libwinplayer_lib.so 引用
      # __cxa_pure_virtual），新 NDK 不再静态链入 libc++，需把
      # libc++_shared.so 打进 APK，否则 dlopen 失败启动即闪退
      - name: Bundle libc++_shared.so
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/*/ | sort -V | tail -1)
          SYSROOT="${NDK_DIR}toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          # NDK 各版本的 triple 目录命名有差异（如 r30 的 armv7 目录名），
          # 用 find 按 glob 定位 libc++_shared.so，避免硬编码路径失效
          bundle() {
            lib=$(find "$SYSROOT" -path "*$2/libc++_shared.so" -print -quit 2>/dev/null)
            if [ -z "$lib" ]; then echo "libc++_shared.so not found for $1"; exit 1; fi
            dest="src-tauri/gen/android/app/src/main/jniLibs/$1"
            mkdir -p "$dest"
            cp "$lib" "$dest/"
            echo "bundled $lib -> $dest"
          }
          bundle arm64-v8a "aarch64-linux-android"
          bundle armeabi-v7a "arm*linux-androideabi"
          bundle x86 "i686-linux-android"
          bundle x86_64 "x86_64-linux-android"

      # 优先使用 Secret 中的固定 debug 密钥（ANDROID_DEBUG_KEYSTORE_BASE64）；
      # 未配置时现场生成并作为 Artifact 上传，下载一次回填为 Secret 后签名即固定
      - name: Import or generate debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "KEYSTORE_FROM_SECRET=true" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Tauri v2 签名方式（官方文档）：gen/android/keystore.properties + Gradle release signingConfig。
      # gen/android 由 CI 每次现场生成，模板不含签名配置，需自动打补丁。
      - name: Configure Android signing
        run: |
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=android
          keyAlias=androiddebugkey
          storeFile=$GITHUB_WORKSPACE/debug.keystore
          EOF
          python3 - <<'PYEOF'
          import pathlib

          p = pathlib.Path("src-tauri/gen/android/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          if "import java.io.FileInputStream" not in s:
              s = s.replace("import java.util.Properties", "import java.io.FileInputStream\nimport java.util.Properties", 1)

          if "signingConfigs {" not in s:
              lines = [
                  "    signingConfigs {",
                  '        create("release") {',
                  '            val keystorePropertiesFile = rootProject.file("keystore.properties")',
                  "            val keystoreProperties = Properties()",
                  "            if (keystorePropertiesFile.exists()) {",
                  "                keystoreProperties.load(FileInputStream(keystorePropertiesFile))",
                  "            }",
                  '            keyAlias = keystoreProperties["keyAlias"]?.toString()',
                  '            keyPassword = keystoreProperties["password"]?.toString()',
                  '            storeFile = (keystoreProperties["storeFile"] as String?)?.let { file(it) }',
                  '            storePassword = keystoreProperties["password"]?.toString()',
                  "        }",
                  "    }",
              ]
              s = s.replace("    buildTypes {", "\n".join(lines) + "\n\n    buildTypes {", 1)

          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace('        getByName("release") {', '        getByName("release") {\n            signingConfig = signingConfigs.getByName("release")', 1)

          p.write_text(s, encoding="utf-8")
          print("gradle signing config patched")
          PYEOF

      - name: Upload keystore artifact
        if: env.KEYSTORE_FROM_SECRET != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
          if-no-files-found: error

      - name: Build Android APK
        run: pnpm tauri android build --apk --split-per-abi

      # 重命名为 WinPlayer-{版本}-android-{架构}.apk
      - name: Rename artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist-renamed
          shopt -s globstar nullglob

          # ABI 从 Gradle 的 split 输出目录取（apk/<abi>/release/app-*.apk），
          # 不能只认文件名：ARM 变体的文件名会把 ABI 中的 - 换成 _，
          # 于是 arm64-v8a / armeabi-v7a 都落进兜底分支，被覆盖成同一个
          # 名为 universal 的包（实际只是其中一种 ABI），arm64 设备拿不到正确包。
          abi_from_path() {
            local seg
            IFS='/' read -ra segs <<< "$1"
            for seg in "${segs[@]}"; do
              case "$seg" in
                arm64-v8a|armeabi-v7a|x86_64|x86|universal) echo "$seg"; return ;;
              esac
            done
          }

          for f in src-tauri/gen/android/app/build/outputs/apk/**/*.apk; do
            name=$(basename "$f")
            abi="$(abi_from_path "$f")"
            case "$abi" in
              arm64-v8a) arch=arm64 ;;
              armeabi-v7a) arch=arm ;;
              x86_64) arch=x86_64 ;;
              x86) arch=x86 ;;
              universal) arch=universal ;;
              *)
                # 兜底：目录中无 ABI 段时，把文件名里的下划线归一化后再匹配
                norm=${name//_/-}
                case "$norm" in
                  *arm64-v8a*) arch=arm64 ;;
                  *armeabi-v7a*) arch=arm ;;
                  *x86-64*|*x86_64*) arch=x86_64 ;;
                  *x86*) arch=x86 ;;
                  *) arch=universal ;;
                esac
                ;;
            esac
            echo "$f -> WinPlayer-$VERSION-android-$arch.apk"
            cp "$f" "dist-renamed/WinPlayer-$VERSION-android-$arch.apk"
          done
          ls -la dist-renamed

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-renamed/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 完整历史 + 全部 tag，用于确定上一个 tag 并按前缀归类提交
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 按提交前缀（feat/fix/refactor/...）分类生成 Release 正文，
      # 无标准前缀的提交（revert、merge 等）归入「其他」兜底；
      # generate_release_notes 会让 GitHub 在此正文后追加贡献者与对比链接
      - name: Generate release notes body
        shell: bash
        run: |
          current="${GITHUB_REF_NAME#refs/tags/}"

          # 上一个 tag：按创建时间升序遍历，取当前 tag 的前一个
          # （兼容重推旧 tag 的场景，倒序取法会拿到更新的 tag 导致区间反向）
          prev=""
          for t in $(git tag --sort=creatordate); do
            if [ "$t" = "$current" ]; then break; fi
            prev="$t"
          done

          if [ -n "$prev" ]; then
            range="$prev..$current"
            echo "commit range: $range"
          else
            # 首个 tag：列出该 tag 包含的全部提交
            range="$current"
            echo "first release, listing all commits up to $current"
          fi

          declare -A sections
          order=(feat fix refactor perf build ci docs style chore other)
          title_of() {
            case "$1" in
              feat)     echo "✨ 新功能";;
              fix)      echo "🐛 问题修复";;
              refactor) echo "♻️ 重构";;
              perf)     echo "⚡️ 性能优化";;
              build)    echo "📦 构建与依赖";;
              ci)       echo "🔧 CI";;
              docs)     echo "📝 文档";;
              style)    echo "💄 样式调整";;
              chore)    echo "🧹 杂项";;
              *)        echo "📁 其他";;
            esac
          }

          # 进程替换而非管道，避免 while 在子 shell 中执行导致 sections 丢失；
          # 正则先存变量，内联写在 [[ =~ ]] 会报语法错误
          re='^([A-Za-z]+)(\([^)]*\))?!?:[[:space:]]*(.+)$'
          while IFS= read -r subject; do
            [ -n "$subject" ] || continue
            if [[ "$subject" =~ $re ]]; then
              base="${BASH_REMATCH[1]}"
              title="${BASH_REMATCH[3]}"
              case "$base" in
                feat|fix|refactor|perf|build|ci|docs|style|chore) : ;;
                *) base=other ;;
              esac
            else
              base=other
              title="$subject"
            fi
            sections["$(title_of "$base")"]+="- $title"$'\n'
          done < <(git log --pretty=format:"%s" "$range")

          # 写到 /tmp：后续版本回写步骤会重新 checkout，actions/checkout
          # 默认 git clean 会清掉工作区内未跟踪文件
          {
            echo "## 更新内容"
            echo
            for cat in feat fix refactor perf build ci docs style chore other; do
              h="$(title_of "$cat")"
              [ -z "${sections[$h]}" ] && continue
              echo "### $h"
              echo "${sections[$h]}"
            done
          } > /tmp/release_body.md

          cat /tmp/release_body.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 版本号回写：把 tag 版本提交回默认分支，保持代码内版本与发布一致；
      # 版本未变（重复触发）时跳过提交
      - name: Commit version bump
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          v="${GITHUB_REF_NAME#refs/tags/}"
          v="${v#v}"
          export V="$v"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"

          python3 - <<'PYEOF'
          import json, os
          for f in ("package.json", "src-tauri/tauri.conf.json"):
              with open(f, encoding="utf-8") as fp:
                  j = json.load(fp)
              j["version"] = os.environ["V"]
              with open(f, "w", encoding="utf-8") as fp:
                  json.dump(j, fp, ensure_ascii=False, indent=2)
                  fp.write("\n")
              print(f"{f} -> {os.environ['V']}")
          PYEOF
          sed -i.bak 's/^version = "[^"]*"/version = "'"$v"'"/' src-tauri/Cargo.toml
          rm src-tauri/Cargo.toml.bak

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          if git diff --cached --quiet; then
            echo "version unchanged, skip commit"
          else
            git commit -m "chore: 升级版本至 $v"
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: /tmp/release_body.md
          generate_release_notes: true
