name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64：NSIS + MSI
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            os: windows
            arch: x64
          # Windows ARM64：NSIS（WiX 暂不支持 arm64 的 msi）
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
            os: windows
            arch: arm64
          # macOS Apple Silicon
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            os: macos
            arch: arm64
          # macOS Intel
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            os: macos
            arch: x64
          # Linux x64（用 22.04 以兼容较旧 glibc）
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            os: linux
            arch: x64
          # Linux ARM64（ubuntu-24.04-arm 免费 runner，仅公共仓库可用；私有仓库请改用交叉编译）
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            os: linux
            arch: arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # 版本号：tag 构建取 tag（去 v 前缀），手动构建回退到 tauri.conf.json
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Tauri v2 Linux 系统依赖（libasound2-dev：cpal/rodio 音频输出的 ALSA 依赖）
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # 重命名为 WinPlayer-{版本}-{平台}-{架构}[-类型].{扩展名}
      - name: Rename artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist-renamed
          base="src-tauri/target/${{ matrix.target }}/release/bundle"
          copy() {
            for f in "$@"; do
              [ -e "$f" ] || continue
              ext="${f##*.}"
              # .exe 加 -setup 类型后缀，避免与同平台其他包混淆
              if [ "$ext" = "exe" ]; then
                cp "$f" "dist-renamed/WinPlayer-$VERSION-$OS-$ARCH-setup.exe"
              else
                cp "$f" "dist-renamed/WinPlayer-$VERSION-$OS-$ARCH.$ext"
              fi
            done
          }
          copy "$base"/nsis/*.exe
          copy "$base"/msi/*.msi
          copy "$base"/dmg/*.dmg
          copy "$base"/deb/*.deb
          copy "$base"/rpm/*.rpm
          copy "$base"/appimage/*.AppImage
          ls -la dist-renamed

      # 归一化产物目录并上传
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist-renamed/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号：tag 构建取 tag（去 v 前缀），手动构建回退到 tauri.conf.json
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub ubuntu runner 已预装 Android SDK / NDK，只需补 Rust 目标
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # gen/android 未入库，首次构建时自动初始化
      - name: Init Android project
        if: hashFiles('src-tauri/gen/android/**') == ''
        run: pnpm tauri android init

      # 优先使用 Secret 中的固定 debug 密钥（ANDROID_DEBUG_KEYSTORE_BASE64）；
      # 未配置时现场生成并作为 Artifact 上传，下载一次回填为 Secret 后签名即固定
      - name: Import or generate debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "KEYSTORE_FROM_SECRET=true" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Tauri v2 签名方式（官方文档）：gen/android/keystore.properties + Gradle release signingConfig。
      # gen/android 由 CI 每次现场生成，模板不含签名配置，需自动打补丁。
      - name: Configure Android signing
        run: |
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=android
          keyAlias=androiddebugkey
          storeFile=$GITHUB_WORKSPACE/debug.keystore
          EOF
          python3 - <<'PYEOF'
          import pathlib

          p = pathlib.Path("src-tauri/gen/android/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          if "import java.io.FileInputStream" not in s:
              s = s.replace("import java.util.Properties", "import java.io.FileInputStream\nimport java.util.Properties", 1)

          if "signingConfigs {" not in s:
              lines = [
                  "    signingConfigs {",
                  '        create("release") {',
                  '            val keystorePropertiesFile = rootProject.file("keystore.properties")',
                  "            val keystoreProperties = Properties()",
                  "            if (keystorePropertiesFile.exists()) {",
                  "                keystoreProperties.load(FileInputStream(keystorePropertiesFile))",
                  "            }",
                  '            keyAlias = keystoreProperties["keyAlias"]?.toString()',
                  '            keyPassword = keystoreProperties["password"]?.toString()',
                  '            storeFile = (keystoreProperties["storeFile"] as String?)?.let { file(it) }',
                  '            storePassword = keystoreProperties["password"]?.toString()',
                  "        }",
                  "    }",
              ]
              s = s.replace("    buildTypes {", "\n".join(lines) + "\n\n    buildTypes {", 1)

          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace('        getByName("release") {', '        getByName("release") {\n            signingConfig = signingConfigs.getByName("release")', 1)

          p.write_text(s, encoding="utf-8")
          print("gradle signing config patched")
          PYEOF

      - name: Upload keystore artifact
        if: env.KEYSTORE_FROM_SECRET != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
          if-no-files-found: error

      - name: Build Android APK
        run: pnpm tauri android build --apk --split-per-abi

      # 重命名为 WinPlayer-{版本}-android-{架构}.apk
      - name: Rename artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist-renamed
          shopt -s globstar nullglob
          for f in src-tauri/gen/android/app/build/outputs/apk/**/*.apk; do
            name=$(basename "$f")
            case "$name" in
              *arm64-v8a*) arch=arm64 ;;
              *armeabi-v7a*) arch=arm ;;
              *x86_64*) arch=x86_64 ;;
              *x86*) arch=x86 ;;
              *) arch=universal ;;
            esac
            cp "$f" "dist-renamed/WinPlayer-$VERSION-android-$arch.apk"
          done
          ls -la dist-renamed

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-renamed/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
